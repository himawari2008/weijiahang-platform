version: '3.8'

services:
  # PostgreSQL 17 + PostGIS
  postgres:
    image: postgis/postgis:17-3.6
    container_name: weijiahang-postgres
    environment:
      POSTGRES_USER: weijiahang
      POSTGRES_PASSWORD: weijiahang123
      POSTGRES_DB: weijiahang_prod
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weijiahang"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: weijiahang-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 后端 API 服务
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: weijiahang-server
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: weijiahang
      DB_PASSWORD: weijiahang123
      DB_DATABASE: weijiahang_prod
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: 
      CSRF_SECRET: 
      ADMIN_IP_WHITELIST: 
      CORS_ORIGIN: 
      WX_APPID: 
      WX_SECRET: 
      CLAUDE_API_KEY: 
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
