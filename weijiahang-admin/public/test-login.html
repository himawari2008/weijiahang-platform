<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>Login Test</title>
<style>
  body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #f5f5f5; }
  .box { background: #fff; padding: 40px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); width: 400px; }
  input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
  button { width: 100%; padding: 12px; background: #FF6B35; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 16px; }
  button:hover { background: #E84A1B; }
  #log { margin-top: 20px; padding: 12px; background: #f0f0f0; border-radius: 6px; font-size: 13px; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
  .error { color: #FF4D4F; } .success { color: #52C41A; }
</style>
</head>
<body>
<div class="box">
  <h2 style="text-align:center; color:#FF6B35;">Login API Test</h2>
  <input id="user" type="text" placeholder="Username" value="admin">
  <input id="pass" type="password" placeholder="Password" value="admin123">
  <button onclick="testLogin()">Test Login (fetch)</button>
  <button onclick="testLoginXHR()" style="background:#1A365D;">Test Login (XHR)</button>
  <div id="log"></div>
</div>
<script>
function log(msg, cls) {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls || ''}">${new Date().toLocaleTimeString()} ${msg}</div>`;
  console.log(msg);
}

async function testLogin() {
  log('=== fetch POST /api/v1/admin/login ===');
  try {
    const res = await fetch('/api/v1/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        username: document.getElementById('user').value,
        password: document.getElementById('pass').value,
      }),
    });
    log(`Status: ${res.status} ${res.statusText}`);
    const data = await res.json();
    log(`Response: ${JSON.stringify(data, null, 2)}`);
    if (data.data?.accessToken) {
      log('SUCCESS: Got accessToken!', 'success');
      log(`Token: ${data.data.accessToken.substring(0, 50)}...`);
    } else {
      log('FAIL: No accessToken in response', 'error');
    }
  } catch (err) {
    log(`ERROR: ${err.message}`, 'error');
  }
}

function testLoginXHR() {
  log('=== XHR POST /api/v1/admin/login ===');
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/v1/admin/login');
  xhr.setRequestHeader('Content-Type', 'application/json');
  xhr.onload = function() {
    log(`Status: ${xhr.status}`);
    log(`Response: ${xhr.responseText}`);
    try {
      const data = JSON.parse(xhr.responseText);
      if (data.data?.accessToken) {
        log('SUCCESS: Got accessToken!', 'success');
      } else {
        log('FAIL: No accessToken', 'error');
      }
    } catch (e) {
      log(`Parse error: ${e.message}`, 'error');
    }
  };
  xhr.onerror = function() {
    log('Network ERROR', 'error');
  };
  xhr.send(JSON.stringify({
    username: document.getElementById('user').value,
    password: document.getElementById('pass').value,
  }));
}
</script>
</body>
</html>
