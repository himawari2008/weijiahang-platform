<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E55A2B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 背景圆形 -->
  <circle cx="100" cy="100" r="100" fill="url(#bg)"/>

  <!-- 屋顶 = 家 -->
  <polygon points="100,42 38,108 162,108" fill="none" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 指南针指针（航） -->
  <polygon points="100,58 80,98 100,90 120,98" fill="#FFFFFF" opacity="0.9"/>
  <polygon points="100,142 80,102 100,110 120,102" fill="#FFFFFF" opacity="0.5"/>

  <!-- 北极星 -->
  <circle cx="100" cy="48" r="4" fill="#FFD700"/>

  <!-- 底部 WJ 字母 -->
  <text x="100" y="150" text-anchor="middle" font-family="Arial, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" letter-spacing="2">WJ</text>
</svg>
