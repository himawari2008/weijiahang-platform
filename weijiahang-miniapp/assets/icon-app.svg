<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <!-- 背景渐变：品牌橙，左上亮 → 右下深 -->
    <linearGradient id="bgGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#FF8C5A"/>
      <stop offset="35%" stop-color="#FF6B35"/>
      <stop offset="100%" stop-color="#D94E20"/>
    </linearGradient>
    <!-- 顶部柔光 -->
    <radialGradient id="glow" cx="0.35" cy="0.25" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ═══ 圆角方形底 ═══ -->
  <rect width="1024" height="1024" rx="230" fill="url(#bgGrad)"/>
  <rect width="1024" height="1024" rx="230" fill="url(#glow)"/>

  <!-- ═══ 指南针外圈 ═══ -->
  <circle cx="512" cy="520" r="260" fill="none" stroke="#FFFFFF" stroke-width="20" opacity="0.85"/>
  <circle cx="512" cy="520" r="238" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.18"/>

  <!-- ═══ 东西轴线 ═══ -->
  <line x1="240" y1="520" x2="784" y2="520" stroke="#FFFFFF" stroke-width="3" opacity="0.15"/>

  <!-- ═══ 刻度标记 ═══ -->
  <!-- 北 -->
  <rect x="502" y="248" width="20" height="24" rx="6" fill="#FFFFFF"/>
  <!-- 南 -->
  <rect x="502" y="768" width="20" height="24" rx="6" fill="#FFFFFF" opacity="0.55"/>
  <!-- 东 -->
  <rect x="744" y="510" width="24" height="20" rx="6" fill="#FFFFFF" opacity="0.45"/>
  <!-- 西 -->
  <rect x="256" y="510" width="24" height="20" rx="6" fill="#FFFFFF" opacity="0.45"/>

  <!-- ═══ 指南针南指针（传统箭头） ═══ -->
  <polygon points="512,540 480,730 544,730" fill="#FFFFFF" opacity="0.45"/>

  <!-- ═══ 房子（取代北指针） ═══ -->
  <!-- 屋顶 — 尖顶即指南针的北向针尖 -->
  <polygon points="512,160 395,440 629,440" fill="#FFFFFF"/>
  <!-- 房身 -->
  <rect x="410" y="440" width="204" height="140" rx="12" fill="#FFFFFF"/>
  <!-- 门（品牌橙） -->
  <rect x="486" y="490" width="52" height="90" rx="26" fill="#FF6B35"/>

  <!-- ═══ 中心圆点 ═══ -->
  <circle cx="512" cy="540" r="18" fill="#FFFFFF"/>
</svg>
